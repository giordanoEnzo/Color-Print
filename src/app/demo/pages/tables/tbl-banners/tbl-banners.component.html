
<!-- B1 -->
<div class="banner-card" [class.loading]="carregando">
  <div class="title">Banner 1 - Home</div>
  <div class="preview">
    <img *ngIf="b1Url; else empty1" [src]="b1Url" alt="Banner 1">
    <ng-template #empty1><div class="placeholder">Sem imagem</div></ng-template>
  </div>
  <div class="actions">
    <input type="file" accept="image/jpeg" id="file-b1" (change)="onFileChange('b1', $event)" hidden>
    <label for="file-b1" class="btn">Selecionar imagem (.jpg)</label>
    <button class="btn primary" [disabled]="!b1File || carregando" (click)="salvar('b1')">Salvar</button>
    <button class="btn danger" [disabled]="carregando || !b1Url" (click)="limpar('b1')">Remover</button>
  </div>
</div>
